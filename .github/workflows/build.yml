name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch version and push
        id: ver
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $parts = $pkg.version -split '\.'
          $parts[2] = [int]$parts[2] + 1
          $newVer = $parts -join '.'
          $pkg.version = $newVer
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add package.json
          git commit -m "chore: bump version to $newVer [skip ci]"
          git push
          echo "version=$newVer" >> $env:GITHUB_OUTPUT
          echo "tag=v$newVer" >> $env:GITHUB_OUTPUT

      - name: Check if tag already exists
        id: check
        shell: pwsh
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          $exists = git tag -l $tag
          if ($exists) {
            echo "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "exists=false" >> $env:GITHUB_OUTPUT
          }

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'false'
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        if: steps.check.outputs.exists == 'false'

      - run: npm run build:portable
        if: steps.check.outputs.exists == 'false'

      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.exists == 'false'
        with:
          name: kgbtools-windows
          path: release/kgbtools.exe

      - name: Create tag and publish release
        if: steps.check.outputs.exists == 'false'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag $tag
          git push origin $tag
          gh release create $tag release/kgbtools.exe `
            --title "KGBtools $tag" `
            --notes "Release automática $tag" `
            --latest

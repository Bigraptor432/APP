<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #060606;
      font-family: Inter, -apple-system, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
      position: relative;
    }

    /* subtle grid background */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(220,38,38,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(220,38,38,0.025) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* center glow */
    body::after {
      content: '';
      position: absolute;
      width: 300px;
      height: 200px;
      background: radial-gradient(ellipse, rgba(220,38,38,0.06) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -60%);
      pointer-events: none;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .badge {
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(220,38,38,0.4);
      margin-bottom: 14px;
      padding: 3px 10px;
      border: 1px solid rgba(220,38,38,0.1);
      border-radius: 20px;
      background: rgba(220,38,38,0.04);
    }

    .logo {
      font-size: 46px;
      font-weight: 700;
      letter-spacing: -1px;
      color: #fff;
      margin-bottom: 3px;
      line-height: 1;
    }

    .logo span { color: #dc2626; }

    .subtitle {
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #1f1f1f;
      margin-bottom: 52px;
    }

    .bar-track {
      width: 260px;
      height: 2px;
      background: #111;
      border-radius: 4px;
      margin-bottom: 18px;
      overflow: visible;
      position: relative;
    }

    .bar-fill {
      height: 100%;
      background: #dc2626;
      border-radius: 4px;
      width: 0%;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .bar-fill::after {
      content: '';
      position: absolute;
      right: -1px;
      top: -3px;
      width: 8px;
      height: 8px;
      background: #dc2626;
      border-radius: 50%;
      box-shadow: 0 0 12px 3px rgba(220,38,38,0.5);
    }

    .info-row {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 16px;
    }

    .pct {
      font-size: 10px;
      font-weight: 600;
      color: #dc2626;
      min-width: 32px;
      text-align: right;
      letter-spacing: 1px;
    }

    .divider {
      width: 1px;
      height: 10px;
      background: #1e1e1e;
    }

    .status-msg {
      font-size: 9px;
      font-weight: 400;
      color: #2a2a2a;
      letter-spacing: 2px;
      text-transform: uppercase;
      min-width: 180px;
    }

    .version {
      position: fixed;
      bottom: 18px;
      right: 18px;
      font-size: 8px;
      letter-spacing: 2px;
      color: #161616;
      font-weight: 400;
    }

    .corner {
      position: fixed;
      width: 16px;
      height: 16px;
      border-color: rgba(220,38,38,0.12);
      border-style: solid;
    }
    .corner-tl { top: 14px; left: 14px; border-width: 1px 0 0 1px; }
    .corner-tr { top: 14px; right: 14px; border-width: 1px 1px 0 0; }
    .corner-bl { bottom: 14px; left: 14px; border-width: 0 0 1px 1px; }
    .corner-br { bottom: 14px; right: 14px; border-width: 0 1px 1px 0; }
  </style>
</head>
<body>
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="wrapper">
    <div class="badge">Pentest Platform</div>
    <div class="logo">KGB<span>tools</span></div>
    <div class="subtitle">Red Team Intelligence</div>
    <div class="bar-track"><div class="bar-fill" id="bar"></div></div>
    <div class="info-row">
      <span class="pct" id="pct">0%</span>
      <div class="divider"></div>
      <span class="status-msg" id="status">Inicializando</span>
    </div>
  </div>

  <div class="version" id="ver">v3.13.0</div>

  <script>
    const steps = [
      { pct: 8,  msg: 'Inicializando' },
      { pct: 20, msg: 'Carregando módulos' },
      { pct: 35, msg: 'Iniciando Electron' },
      { pct: 48, msg: 'Preparando interface' },
      { pct: 62, msg: 'Conectando ao Kali MCP' },
      { pct: 74, msg: 'Carregando ferramentas' },
      { pct: 85, msg: 'Sincronizando brain' },
      { pct: 93, msg: 'Verificando updates' },
      { pct: 100, msg: 'Pronto' },
    ];

    const bar    = document.getElementById('bar');
    const pctEl  = document.getElementById('pct');
    const status = document.getElementById('status');

    let i = 0;
    function nextStep() {
      if (i >= steps.length) return;
      const { pct, msg } = steps[i++];
      bar.style.width = pct + '%';
      pctEl.textContent = pct + '%';
      status.textContent = msg;
      if (pct === 100) bar.style.removeProperty('transition'), (bar.style.boxShadow = 'none');
      if (i < steps.length) setTimeout(nextStep, 220 + Math.random() * 320);
    }
    setTimeout(nextStep, 250);
  </script>
</body>
</html>
